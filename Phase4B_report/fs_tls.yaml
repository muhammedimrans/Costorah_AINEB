admin: {address: {socket_address: {address: 127.0.0.1, port_value: 19902}}}
static_resources:
  listeners:
  - name: l
    address: {socket_address: {address: 127.0.0.1, port_value: 10001}}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress
          route_config:
            name: r
            virtual_hosts:
            - name: v
              domains: ["*"]
              routes: [{match: {prefix: "/"}, route: {cluster: single}}]
          http_filters:
          - name: envoy.filters.http.set_filter_state
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
              on_request_headers:
              - object_key: envoy.string
                factory_key: envoy.string
                format_string:
                  text_format_source:
                    inline_string: "%REQ(x-agent-principal)%"
                shared_with_upstream: ONCE
          - name: envoy.filters.http.router
            typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}
  clusters:
  - name: single
    connect_timeout: 3s
    type: STATIC
    load_assignment: {cluster_name: single, endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: 127.0.0.1, port_value: 10002}}}}]}]}
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: upstream.agents.internal
        common_tls_context:
          alpn_protocols: ["h2"]
          validation_context:
            trusted_ca: {filename: /home/claude/p4b/certs/ca.crt}
            match_typed_subject_alt_names:
            - san_type: DNS
              matcher: {exact: upstream.agents.internal}
